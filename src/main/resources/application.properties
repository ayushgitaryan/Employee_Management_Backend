# ===== Database Connection =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:empdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong}

# ===== Server =====
server.port=${PORT:8080}

# ===== Pagination =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100